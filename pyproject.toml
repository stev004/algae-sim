[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "algae-sim"
version = "0.2.0"
description = "Simulated algae photobioreactor with local control and an AutoLab adapter"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Steven Matson" }]
dependencies = []  # the reactor core is standard-library only

[project.optional-dependencies]
# AutoLab with stage-6 culture support. Until that is pushed, uv resolves it from
# the sibling checkout ../autolab (see [tool.uv.sources]); it must be on a branch
# containing stage 6 (currently `stage6-culture-slice-b`).
autolab = ["autonomous-lab>=0.5"]
plot = ["matplotlib>=3.9,<4"]

[dependency-groups]
dev = ["pytest>=8.3,<9", "ruff>=0.9,<1"]

[project.scripts]
algae-sim = "algae_sim.cli:main"

# AutoLab discovers third-party read-only sensors through this entry-point group.
[project.entry-points."autonomous_lab.sensor_adapters"]
algae_sim_od = "algae_sim.autolab.sensor:create_sensor"

# AutoLab stage 6 discovers setpoint-accepting culture controllers here.
[project.entry-points."autonomous_lab.culture_controllers"]
algae-sim-reactor = "algae_sim.autolab.controller:create_controller"

[tool.uv.sources]
autonomous-lab = { path = "../autolab", editable = true }

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["algae_sim"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
