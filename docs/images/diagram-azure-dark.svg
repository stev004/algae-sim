<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 372" width="750" height="372" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Azure setup: one Entra ID sign-in; the laptop uploader sends raw batches to Blob Storage and clean rows to Data Explorer">
<title>Azure setup: one Entra ID sign-in; the laptop uploader sends raw batches to Blob Storage and clean rows to Data Explorer</title>
<defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3987e5"/></marker><marker id="head-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#898781"/></marker></defs>
<rect width="750" height="372" rx="14" fill="#1a1a19"/>
<rect x="30" y="30" width="270" height="84" rx="10" fill="#262624" stroke="#383835" stroke-width="1.2"/>
<text x="46" y="59" font-size="15" font-weight="700" fill="#f0efec">Microsoft Entra ID</text>
<text x="46" y="84" font-size="13" fill="#c3c2b7">one sign-in, cached;</text>
<text x="46" y="103" font-size="13" fill="#c3c2b7">no keys anywhere</text>
<rect x="30" y="176" width="270" height="132" rx="10" fill="#262624" stroke="#383835" stroke-width="1.2"/>
<text x="46" y="205" font-size="15" font-weight="700" fill="#f0efec">Laptop</text>
<text x="46" y="230" font-size="13" fill="#c3c2b7">simulated device&#x27;s capture log</text>
<text x="46" y="249" font-size="13" fill="#c3c2b7">→ uploader, same parse rules</text>
<text x="46" y="268" font-size="13" fill="#c3c2b7">retries after outages</text>
<rect x="420" y="30" width="300" height="112" rx="10" fill="#1d2a3a" stroke="#3987e5" stroke-width="1.2"/>
<text x="436" y="59" font-size="15" font-weight="700" fill="#f0efec">Blob Storage</text>
<text x="436" y="84" font-size="13" fill="#c3c2b7">every batch, byte for byte</text>
<text x="436" y="103" font-size="13" fill="#c3c2b7">role: write blobs only</text>
<rect x="420" y="196" width="300" height="132" rx="10" fill="#1d2a3a" stroke="#3987e5" stroke-width="1.2"/>
<text x="436" y="225" font-size="15" font-weight="700" fill="#f0efec">Data Explorer</text>
<text x="436" y="250" font-size="13" fill="#c3c2b7">tables → dedupe views → report</text>
<text x="436" y="269" font-size="13" fill="#c3c2b7">role: ingest + read only</text>
<text x="436" y="288" font-size="13" fill="#c3c2b7">free cluster</text>
<path d="M 165 116 L 165 170" fill="none" stroke="#898781" stroke-width="1.8" stroke-dasharray="5 5" marker-end="url(#head-muted)"/>
<text x="175" y="149.0" font-size="12.5" fill="#c3c2b7">signs in</text>
<path d="M 300 214 L 360 214 L 360 86 L 414 86" fill="none" stroke="#3987e5" stroke-width="1.8" marker-end="url(#head)"/>
<text x="352" y="150" text-anchor="end" font-size="12.5" fill="#c3c2b7">raw batches</text>
<path d="M 300 262 L 414 262" fill="none" stroke="#3987e5" stroke-width="1.8" marker-end="url(#head)"/>
<text x="357" y="252" text-anchor="middle" font-size="12.5" fill="#c3c2b7">clean rows</text>
<text x="30" y="352" font-size="12.5" fill="#898781">£0: free account with a hard spending limit, plus the free Data Explorer cluster</text>
</svg>
