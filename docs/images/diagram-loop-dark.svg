<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 942 378" width="942" height="378" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="The closed loop: AutoLab proposes, the device holds, QC checks, the optimiser learns">
<title>The closed loop: AutoLab proposes, the device holds, QC checks, the optimiser learns</title>
<defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3987e5"/></marker><marker id="head-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#898781"/></marker></defs>
<rect width="942" height="378" rx="14" fill="#1a1a19"/>
<rect x="30" y="84" width="230" height="108" rx="10" fill="#262624" stroke="#383835" stroke-width="1.2"/>
<circle cx="52" cy="108" r="11" fill="#3987e5"/>
<text x="52" y="112.5" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a19">1</text>
<text x="72" y="113" font-size="15" font-weight="700" fill="#f0efec">Propose</text>
<text x="46" y="138" font-size="13" fill="#c3c2b7">AutoLab&#x27;s optimiser picks</text>
<text x="46" y="157" font-size="13" fill="#c3c2b7">temperature, light and pH</text>
<rect x="356" y="84" width="230" height="108" rx="10" fill="#1d2a3a" stroke="#3987e5" stroke-width="1.2"/>
<circle cx="378" cy="108" r="11" fill="#3987e5"/>
<text x="378" y="112.5" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a19">2</text>
<text x="398" y="113" font-size="15" font-weight="700" fill="#f0efec">Hold</text>
<text x="372" y="138" font-size="13" fill="#c3c2b7">3 reactors keep the conditions</text>
<text x="372" y="157" font-size="13" fill="#c3c2b7">with their own control and safety</text>
<rect x="682" y="84" width="230" height="108" rx="10" fill="#262624" stroke="#383835" stroke-width="1.2"/>
<circle cx="704" cy="108" r="11" fill="#3987e5"/>
<text x="704" y="112.5" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a19">3</text>
<text x="724" y="113" font-size="15" font-weight="700" fill="#f0efec">Check</text>
<text x="698" y="138" font-size="13" fill="#c3c2b7">QC on every replicate;</text>
<text x="698" y="157" font-size="13" fill="#c3c2b7">2 of 3 must pass</text>
<rect x="356" y="262" width="230" height="88" rx="10" fill="#262624" stroke="#383835" stroke-width="1.2"/>
<text x="372" y="291" font-size="15" font-weight="700" fill="#f0efec">Data pipeline</text>
<text x="372" y="316" font-size="13" fill="#c3c2b7">capture → validate → store</text>
<text x="372" y="335" font-size="13" fill="#c3c2b7">locally or on Azure</text>
<path d="M 264 138.0 L 350 138.0" fill="none" stroke="#3987e5" stroke-width="1.8" marker-end="url(#head)"/>
<text x="308.0" y="128.0" text-anchor="middle" font-size="12.5" fill="#c3c2b7">setpoints</text>
<path d="M 590 138.0 L 676 138.0" fill="none" stroke="#3987e5" stroke-width="1.8" marker-end="url(#head)"/>
<text x="634.0" y="128.0" text-anchor="middle" font-size="12.5" fill="#c3c2b7">readings</text>
<path d="M 797.0 82 L 797.0 34 L 145.0 34 L 145.0 78" fill="none" stroke="#3987e5" stroke-width="1.8" marker-end="url(#head)"/>
<rect x="421.0" y="21" width="100" height="26" rx="13" fill="#1a1a19"/>
<circle cx="443.0" cy="34" r="11" fill="#3987e5"/><text x="443.0" y="38.5" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a19">4</text>
<text x="461.0" y="39" font-size="14" font-weight="700" fill="#f0efec">Learn</text>
<path d="M 471.0 194 L 471.0 256" fill="none" stroke="#898781" stroke-width="1.8" stroke-dasharray="5 5" marker-end="url(#head-muted)"/>
<text x="481.0" y="232" font-size="12.5" fill="#c3c2b7">measured data</text>
</svg>
